[bootstrap.repos]
"~/.local/share/dotfiles" = { url = "https://github.com/jasonmorganson/dotfiles.git", ref = "main" }
"~/.local/share/mise/repos/gitalias" = { url = "https://github.com/GitAlias/gitalias.git", ref = "main" }
"~/.config/nushell/scripts/nu_scripts" = { url = "https://github.com/nushell/nu_scripts.git" }

[bootstrap.packages]
"brew:git" = "latest"

[bootstrap.hooks.post-tools]
run = '''
mise_bin="${MISE_BIN:-$HOME/.local/bin/mise}"
case "$(uname -s)" in
    Darwin) git_prefix=/opt/homebrew ;;
    Linux) git_prefix=/home/linuxbrew/.linuxbrew ;;
esac
PATH="$git_prefix/bin:$PATH" "$mise_bin" exec -- hk install --global --mise
'''

[bootstrap.macos.dock]
autohide = true

[bootstrap.macos.defaults]
"com.apple.dock" = { autohide-delay = 1000.0 }

[bootstrap.directories]
"~/.local/state/bash/sessions" = { mode = "0755" }
"~/.local/state/python" = { mode = "0755" }
"~/.config/bash" = { mode = "0755" }
"~/.config/zsh" = { mode = "0755" }
"~/.config/fish/conf.d" = { mode = "0755" }
"~/.config/nushell" = { mode = "0755" }
"~/.config/claude" = { mode = "0755" }
"~/.config/codex" = { mode = "0755" }
"~/.config/docker" = { mode = "0755" }
"~/.config/git" = { mode = "0755" }
"~/.ssh" = { mode = "0700" }
