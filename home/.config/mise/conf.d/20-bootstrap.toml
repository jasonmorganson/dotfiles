[bootstrap.repos]
"~/.local/share/dotfiles" = { url = "https://github.com/jasonmorganson/dotfiles.git", ref = "main" }
"~/.local/share/mise/repos/gitalias" = { url = "https://github.com/GitAlias/gitalias.git", ref = "main" }
"~/.config/nushell/scripts/nu_scripts" = { url = "https://github.com/nushell/nu_scripts.git" }

[bootstrap.mise_shell_activate]
# ZDOTDIR points at ~/.config/zsh. Keep that entrypoint dotfiles-owned so tool
# upgrades cannot leave a generated, version-pinned Pitchfork integration
# behind; the entrypoint still evaluates mise's generated activation.
zsh = false
bash = true
fish = true

[bootstrap.macos.dock]
autohide = true

[bootstrap.macos.defaults]
"com.apple.dock" = { autohide-delay = 1000.0 }

[bootstrap.hooks.pre-dotfiles]
run = "mkdir -p ~/.local/state/bash/sessions ~/.local/state/python ~/.config/bash ~/.config/zsh ~/.config/fish/conf.d ~/.config/nushell ~/.config/claude ~/.config/codex ~/.config/docker"
