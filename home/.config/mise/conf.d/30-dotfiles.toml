[dotfiles]
# Sources under home/ mirror their targets and are resolved through dotfiles.root.
"~/.bash_sessions" = { source = "~/.local/state/bash/sessions", mode = "symlink" }
"~/.claude" = { source = "~/.config/claude", mode = "symlink" }
"~/.codex" = { source = "~/.config/codex", mode = "symlink" }
"~/.config/mise/config.toml" = { mode = "symlink" }
"~/.config/mise/config.macos.toml" = { mode = "symlink" }
"~/.config/mise/conf.d/10-tools.toml" = { mode = "symlink" }
"~/.config/mise/conf.d/20-bootstrap.toml" = { mode = "symlink" }
"~/.config/mise/conf.d/30-dotfiles.toml" = { mode = "symlink" }
"~/.config/mise/conf.d/40-env.toml" = { mode = "symlink" }
"~/.config/mise/conf.d/50-aliases.toml" = { mode = "symlink" }
"~/.config/mise/mise.lock" = { mode = "symlink" }
"~/.config/mise/miserc.toml" = { mode = "symlink" }
"~/.config/mise/tasks/bootstrap" = { mode = "symlink" }
"~/.config/mise/tasks/test" = { mode = "symlink" }
"~/.config/bash/rc" = { mode = "copy" }
"~/.bash_profile/activate" = { line = 'eval "$(mise activate bash --shims)"', position = "prepend" }
"~/.bash_profile/local" = { block = '[[ -f "$HOME/.bashrc" ]] && . "$HOME/.bashrc"' }
"~/.bashrc/activate" = { line = 'eval "$(mise activate bash)"', position = "prepend" }
"~/.bashrc/local" = { block = '[[ -f "$HOME/.config/bash/rc" ]] && . "$HOME/.config/bash/rc"' }
"~/.config/zsh/rc" = { mode = "copy" }
"~/.zprofile/activate" = { line = 'eval "$(mise activate zsh --shims)"', position = "prepend" }
"~/.zshrc/activate" = { line = 'eval "$(mise activate zsh)"', position = "prepend" }
"~/.zshrc/local" = { block = '''
[[ -f "$HOME/.config/zsh/rc" ]] && . "$HOME/.config/zsh/rc"
[[ -f "$HOME/.config/zsh/preferences.zsh" ]] && . "$HOME/.config/zsh/preferences.zsh"
''' }
"~/.config/fish/conf.d/00-mise.fish" = { mode = "copy" }
"~/.config/fish/conf.d/local.fish" = { mode = "copy" }
"~/.config/fish/conf.d/preferences.fish" = { mode = "copy" }
"~/.config/docker/config.json" = { mode = "copy" }
"~/.config/git" = { mode = "copy", exclude = ["ignore"] }
"~/.config/git/gitalias" = { source = "~/.local/share/mise/repos/gitalias/gitalias.txt", mode = "copy" }
"~/.config/git/ignore" = { mode = "template" }
"~/.config/nushell/env.nu" = { mode = "copy" }
"~/.config/nushell/config.nu" = { mode = "copy" }
"~/.config/nushell/autoload/preferences.nu" = { mode = "copy" }
"~/.config/pitchfork/config.toml" = { mode = "copy" }
"~/.config/readline/inputrc" = { mode = "copy" }
"~/.config/ssh/config/github.conf" = { mode = "copy" }
"~/.config/ssh/known_hosts" = { mode = "copy" }
"~/.config/ssh/config/mac.conf" = { mode = "copy" }
"~/.config/ssh/config/term.conf" = { mode = "copy" }
"~/.config/zsh/preferences.zsh" = { mode = "copy" }
"~/.docker" = { source = "~/.config/docker", mode = "symlink" }
"~/.hushlogin" = { mode = "copy" }
"~/.ssh/config" = { mode = "copy" }
"~/Library/Application Support/nushell" = { source = "~/.config/nushell", mode = "symlink" }
