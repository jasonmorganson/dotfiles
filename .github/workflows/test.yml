name: Test

on: pull_request

env:
  # CI exercises the repository as the global mise config before adoption.
  MISE_CONFIG_DIR: ${{ github.workspace }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_USER: ${{ github.repository_owner }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Run tests
        run: mise run test

  fresh-install:
    runs-on: macos-26
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        codex: [absent, symlink]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare fresh installation
        env:
          CODEX_FIXTURE: ${{ matrix.codex }}
        run: |
          test ! -e "$HOME/.config/mise"
          test ! -e "$HOME/.local/share/mise"
          test ! -e "$HOME/.local/bin/mise"
          test ! -e "$HOME/.codex"
          if [ "$CODEX_FIXTURE" = symlink ]; then
            mkdir -p "$HOME/.config/codex"
            ln -s .config/codex "$HOME/.codex"
            printf 'preserve me\n' > "$HOME/.codex/sentinel"
          fi
      - name: Run public installer without credentials or input
        shell: bash
        run: |
          # Test the checked-out PR through the public installer.
          # Both URL forms resolve to this checkout without changing install.sh.
          env -i \
            HOME="$HOME" USER="$USER" SHELL=/bin/zsh TERM=dumb \
            PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            GIT_CONFIG_COUNT=2 \
            GIT_CONFIG_KEY_0="url.file://$GITHUB_WORKSPACE/.insteadOf" \
            GIT_CONFIG_VALUE_0="https://github.com/${{ github.repository }}.git" \
            GIT_CONFIG_KEY_1="url.file://$GITHUB_WORKSPACE/.insteadOf" \
            GIT_CONFIG_VALUE_1="https://github.com/${{ github.repository }}" \
            /bin/bash -o pipefail -c 'curl -fsSL https://install.morganson.me | sh' </dev/null
      - name: Verify installation
        env:
          CODEX_FIXTURE: ${{ matrix.codex }}
        run: |
          test "$(git -C "$HOME/.config/mise" rev-parse HEAD)" = "$(git rev-parse HEAD)"
          "$HOME/.local/bin/mise" exec -- sh -ec 'test -n "$LS_COLORS"; vivid --version'
          test "$("$HOME/.local/bin/mise" settings get system_packages.elevate_with)" = /usr/bin/sudo
          if [ "$CODEX_FIXTURE" = symlink ]; then
            test -L "$HOME/.codex"
            test "$(cat "$HOME/.codex/sentinel")" = 'preserve me'
          fi
