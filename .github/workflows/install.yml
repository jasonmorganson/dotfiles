name: Test install script

on: push

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_USER: ${{ github.repository_owner }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, macos-14, macos-15, macos-26]
    runs-on: ${{ matrix.platform }}
    steps:
    - uses: actions/checkout@v7
    - name: Run install script
      run: |
        fixture_home="$RUNNER_TEMP/dotfiles-home"
        mkdir -p "$fixture_home"
        env \
          HOME="$fixture_home" \
          XDG_CACHE_HOME="$fixture_home/.cache" \
          XDG_CONFIG_HOME="$fixture_home/.config" \
          XDG_DATA_HOME="$fixture_home/.local/share" \
          XDG_STATE_HOME="$fixture_home/.local/state" \
          ./install.sh
