name: Test install script

on: push

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_USER: ${{ github.repository_owner }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, macos-14, macos-15, macos-26]
    runs-on: ${{ matrix.platform }}
    steps:
    - uses: actions/checkout@v7
    - name: Run install script
      env:
        MISE_BOOTSTRAP_REPO: ${{ github.repository }}?ref=${{ github.ref_name }}
      run: ./install.sh
    - name: Verify LS_COLORS
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        test -n "$(mise exec -- printenv LS_COLORS)"
