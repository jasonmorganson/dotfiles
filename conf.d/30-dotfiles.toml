[dotfiles]
# Relative sources resolve from this global mise configuration directory.
"~/.bash_sessions" = { source = "~/.local/state/bash/sessions", mode = "symlink" }
"~/.claude" = { source = "~/.config/claude", mode = "symlink" }
"~/.config/codex" = { source = "~/.codex", mode = "symlink" }
"~/.config/bash/rc" = { source = "../home/.config/bash/rc", mode = "copy" }
"~/.bash_profile/activate" = { line = 'eval "$(mise activate bash --shims)"', position = "prepend" }
"~/.bash_profile/local" = { block = '[[ -f "$HOME/.bashrc" ]] && . "$HOME/.bashrc"' }
"~/.bashrc/activate" = { line = 'eval "$(mise activate bash)"', position = "prepend" }
"~/.bashrc/local" = { block = '[[ -f "$HOME/.config/bash/rc" ]] && . "$HOME/.config/bash/rc"' }
"~/.config/zsh/rc" = { source = "../home/.config/zsh/rc", mode = "copy" }
"~/.zprofile/activate" = { line = 'eval "$(mise activate zsh --shims)"', position = "prepend" }
"~/.zshrc/activate" = { line = 'eval "$(mise activate zsh)"', position = "prepend" }
"~/.zshrc/local" = { block = '''
[[ -f "$HOME/.config/zsh/rc" ]] && . "$HOME/.config/zsh/rc"
[[ -f "$HOME/.config/zsh/preferences.zsh" ]] && . "$HOME/.config/zsh/preferences.zsh"
''' }
"~/.config/fish/conf.d/00-mise.fish" = { source = "../home/.config/fish/conf.d/00-mise.fish", mode = "copy" }
"~/.config/fish/conf.d/local.fish" = { source = "../home/.config/fish/conf.d/local.fish", mode = "copy" }
"~/.config/fish/conf.d/preferences.fish" = { source = "../home/.config/fish/conf.d/preferences.fish", mode = "copy" }
"~/.config/docker/config.json" = { source = "../home/.config/docker/config.json", mode = "copy" }
"~/.config/git" = { source = "../home/.config/git", mode = "copy", exclude = ["ignore"] }
"~/.config/git/gitalias" = { source = "~/.local/share/mise/repos/gitalias/gitalias.txt", mode = "copy" }
"~/.config/git/ignore" = { source = "../home/.config/git/ignore", mode = "template" }
"~/.config/nushell/env.nu" = { source = "../home/.config/nushell/env.nu", mode = "copy" }
"~/.config/nushell/config.nu" = { source = "../home/.config/nushell/config.nu", mode = "copy" }
"~/.config/nushell/autoload/preferences.nu" = { source = "../home/.config/nushell/autoload/preferences.nu", mode = "copy" }
"~/.config/pitchfork/config.toml" = { source = "../home/.config/pitchfork/config.toml", mode = "copy" }
"~/.config/readline/inputrc" = { source = "../home/.config/readline/inputrc", mode = "copy" }
"~/.config/ssh/github.conf" = { source = "../home/.config/ssh/github.conf", mode = "copy" }
"~/.config/ssh/known_hosts" = { source = "../home/.config/ssh/known_hosts", mode = "copy" }
"~/.config/ssh/mac.conf" = { source = "../home/.config/ssh/mac.conf", mode = "copy" }
"~/.config/ssh/term.conf" = { source = "../home/.config/ssh/term.conf", mode = "copy" }
"~/.config/zsh/preferences.zsh" = { source = "../home/.config/zsh/preferences.zsh", mode = "copy" }
"~/.docker" = { source = "~/.config/docker", mode = "symlink" }
"~/.hushlogin" = { source = "../home/.hushlogin", mode = "copy" }
"~/.ssh/config" = { source = "../home/.ssh/config", mode = "copy" }
"~/Library/Application Support/nushell" = { source = "~/.config/nushell", mode = "symlink" }
